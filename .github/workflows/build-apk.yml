name: Build StaffifyMOB Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'staffify-mob/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'staffify-mob/package-lock.json'

      - name: Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install StaffifyMOB Dependencies
        working-directory: ./staffify-mob
        run: npm install

      - name: Build Web Bundle
        working-directory: ./staffify-mob
        run: npm run build

      - name: Sync Capacitor Android Native Scaffolding
        working-directory: ./staffify-mob
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        working-directory: ./staffify-mob/android
        run: chmod +x ./gradlew

      - name: Assemble Debug APK
        working-directory: ./staffify-mob/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-artifacts
          cp staffify-mob/android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/StaffifyMOB-debug.apk

      - name: Upload StaffifyMOB APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StaffifyMOB-debug-apk
          path: build-artifacts/StaffifyMOB-debug.apk
          retention-days: 30

<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="staffifyBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052CC" />
      <stop offset="50%" stop-color="#0747A6" />
      <stop offset="100%" stop-color="#00388B" />
    </linearGradient>
    <linearGradient id="staffifySGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="40%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#38B6FF" />
    </linearGradient>
    <filter id="staffifyDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect width="40" height="40" rx="10" fill="url(#staffifyBgGrad)" />
  <rect x="0.75" y="0.75" width="38.5" height="38.5" rx="9.25" stroke="white" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Iconic S Monogram -->
  <path d="M 27 12 C 22.5 9.5 13 11 13 16.5 C 13 21.8 27 19.2 27 24.5 C 27 30 17.5 31 13 28.2" 
        stroke="url(#staffifySGrad)" 
        stroke-width="4.2" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#staffifyDropShadow)" />
        
  <!-- Center Dynamic Talent Spark -->
  <circle cx="20" cy="20.5" r="1.6" fill="#00F0FF" />
</svg>
